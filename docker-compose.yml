services:
  postgres:
    image: postgres:16
    container_name: smartsheets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartsheets
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: smartsheets_view
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsheets -d smartsheets_view"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
